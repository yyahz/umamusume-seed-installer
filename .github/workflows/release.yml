name: Build private test release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test and build
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $releaseVersion) { $releaseVersion = "0.1.0-alpha.1" }
          .\scripts\build-release.ps1 -Version $releaseVersion

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmaSeedInstaller-win-x64
          path: artifacts/*

      - name: Create prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
